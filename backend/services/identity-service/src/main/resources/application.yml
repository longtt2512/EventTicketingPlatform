server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_ticketing}
    username: ${DB_USERNAME:app_identity}
    password: ${DB_PASSWORD:local_identity}
  flyway:
    enabled: true
    schemas: identity
    default-schema: identity
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: identity
      hibernate.jdbc.time_zone: UTC
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  data-encryption-key: ${DATA_ENCRYPTION_KEY:}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:14200}
  web-base-url: ${WEB_BASE_URL:http://localhost:14200}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:10}
    clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:60}
  refresh-token:
    ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}
    cookie-name: ${REFRESH_COOKIE_NAME:refresh_token}
    secure: ${COOKIE_SECURE:false}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  service-token: ${IDENTITY_SERVICE_TOKEN:local-service-token}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
