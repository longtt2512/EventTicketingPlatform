server:
  port: ${SERVER_PORT:8086}
spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_ticketing}
    username: ${DB_USERNAME:app_notification}
    password: ${DB_PASSWORD:local_notification}
  flyway:
    schemas: notification
    default-schema: notification
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-notifications-v1
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 3000
management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  identity-base-url: ${IDENTITY_BASE_URL:http://localhost:8081}
  web-base-url: ${WEB_BASE_URL:http://localhost:14200}
  service-token: ${IDENTITY_SERVICE_TOKEN:local-service-token}
  organization-base-url: ${ORGANIZATION_SERVICE_URL:http://localhost:8082}
  commerce-base-url: ${COMMERCE_BASE_URL:http://localhost:8083}
  finance-base-url: ${FINANCE_SERVICE_URL:http://localhost:8089}
  operations-base-url: ${ADMIN_OPERATIONS_SERVICE_URL:http://localhost:8090}
  admission-base-url: ${ADMISSION_SERVICE_URL:http://localhost:8087}
  organizer-web-base-url: ${ORGANIZER_WEB_BASE_URL:http://localhost:14200/org}
