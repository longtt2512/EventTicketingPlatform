server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:14200}
            allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowedHeaders: '*'
            allowCredentials: true
      routes:
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/users/**,/api/v1/.well-known/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/orders/*/payment-attempts,/api/v1/orders/*/payment-status,/api/v1/local-payments/**,/api/v1/payment-sessions/**,/api/v1/webhooks/payments/**,/api/v1/admin/payments/**,/api/v1/admin/payment-exceptions/**
        - id: ticket-admission-service
          uri: ${ADMISSION_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/tickets/**,/api/v1/orders/*/tickets,/api/v1/check-in/**
        - id: event-commerce-service
          uri: ${COMMERCE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/discover/categories,/api/v1/admin/categories/**,/api/v1/admin/orders/**,/api/v1/orders/**,/api/v1/events/*/booking,/api/v1/organizations/*/events/*/orders/**,/api/v1/organizations/*/events,/api/v1/organizations/*/events/*,/api/v1/organizations/*/events/*/submit,/api/v1/organizations/*/events/*/publish,/api/v1/organizations/*/events/*/cancel,/api/v1/organizations/*/events/*/history,/api/v1/organizations/*/events/*/attendees,/api/v1/organizations/*/events/*/ticket-types/**,/api/v1/admin/events/**,/api/v1/media/**
        - id: discovery-service
          uri: ${DISCOVERY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/discover/**,/api/v1/organizations/*/reports/**,/api/v1/admin/reports/**
        - id: finance-service
          uri: ${FINANCE_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/admin/commission-config/**,/api/v1/admin/settlements/**,/api/v1/organizations/*/settlements/**
        - id: admin-operations-service
          uri: ${ADMIN_OPERATIONS_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/v1/admin/audit-logs/**,/api/v1/admin/settings/**
        - id: organization-service
          uri: ${ORGANIZATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/organizer-applications/**,/api/v1/admin/organizer-applications/**,/api/v1/organizations/**,/api/v1/admin/organizations/**,/api/v1/verification-documents/**,/api/v1/staff/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
