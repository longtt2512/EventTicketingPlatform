server:
  port: ${SERVER_PORT:8083}
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: commerce-payments-v1
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 3000
  application:
    name: event-commerce-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_ticketing}
    username: ${DB_USERNAME:app_event_commerce}
    password: ${DB_PASSWORD:local_event_commerce}
  flyway:
    schemas: event_commerce
    default-schema: event_commerce
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWK_URI:http://localhost:8081/api/v1/.well-known/jwks.json}
app:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
  identity:
    base-url: ${IDENTITY_BASE_URL:http://localhost:8081}
    service-token: ${IDENTITY_SERVICE_TOKEN:local-service-token}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:localminio}
    secret-key: ${MINIO_SECRET_KEY:localminio123}
  finance-base-url: ${FINANCE_SERVICE_URL:http://localhost:8089}
  admission-base-url: ${ADMISSION_SERVICE_URL:http://localhost:8088}
  discovery-base-url: ${DISCOVERY_SERVICE_URL:http://localhost:8084}
  organization-base-url: ${ORGANIZATION_SERVICE_URL:http://localhost:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info
