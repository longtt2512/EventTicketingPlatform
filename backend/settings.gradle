pluginManagement {
    plugins {
        id 'org.springframework.boot' version '3.4.4'
        id 'io.spring.dependency-management' version '1.1.7'
    }
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'event-ticketing-backend'

include(
    ':services:api-gateway',
    ':services:discovery-service',
    ':services:payment-service',
    ':services:finance-service',
    ':services:admin-operations-service',
    ':services:ticket-admission-service',
    ':services:notification-service',
    ':services:identity-service',
    ':services:organization-service',
    ':services:event-commerce-service',
    ':libs:platform-starter',
    ':libs:security-starter',
    ':libs:messaging-starter'
)
